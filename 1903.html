<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>

    :root {
      --bg: #3f3f3f;
      --bg-deep: #333333;
      --teal: #24b2b9;
      --teal-light: #62dbe1;
      --teal-deep: #178489;
      --white: #ffffff;
      --muted: #b9b9b9;
      --room-unfunded: #dddddd;

      /*
        ---- Layout system ----
        One vertical unit = 1/12 of the viewport height. Twelve divides
        cleanly into three macro-thirds of 4 units each, so the page's major
        zones are assigned in whole units below and the bottom zone (photo +
        campaign message) lands on exactly the lower third of the frame --
        a deliberate rule-of-thirds composition, not an eyeballed split.
        One horizontal gutter is reused by every section so content edges
        line up down the page instead of drifting section to section.
      */
      --unit: 8.3333vh;
      --gutter: 5vw;

      /*
        ---- Type scale ----
        A small fixed set of sizes, each used for exactly one role, so
        nothing is sized ad hoc. All in vh so the whole hierarchy scales
        together with the panel.
      */
      --fs-eyebrow: 1.5vh;   /* uppercase micro-labels: GOAL, GIVE ONLINE, SCAN TO GIVE */
      --fs-body: 2.15vh;     /* give-link URL text */
      --fs-heading: 3.3vh;   /* "Give Now" heading */
      --fs-stat: 2.7vh;      /* Goal / Raised / Remaining figures -- capped so a
                                 full "$2,400,000" never outgrows its 1-of-3
                                 column at the gutter's width */
      --fs-lockup: 3.5vh;    /* "for" beside the mini campaign logo */
      --fs-hero-base: 9vh;  /* starting size for the auto-fit cycle word; JS scales
                                 it per word so every word fills the same width,
                                 matching the reference mock-up's full-bleed type */
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: 'Barlow', sans-serif;
    }

    /*
      This page is written for a PORTRAIT viewport (it will be loaded inside
      the Paradise-Signage-style Android WebView that resizes/rotates itself
      in software -- see MainActivity's rotation container -- so the WebView
      genuinely receives a portrait-shaped viewport matching the panel's real
      resolution, e.g. 2160x3840). Everything below is sized with vh/vw/the
      --unit and --gutter tokens so it scales cleanly to whatever exact
      portrait resolution it lands on.
    */

    .stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(120% 90% at 50% 0%, var(--bg) 0%, var(--bg-deep) 100%);
    }

    /* ---------- Reveal-on-load animation ---------- */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(3vh); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .reveal {
      opacity: 0;
      animation: fadeUp 1.1s cubic-bezier(.16,.8,.3,1) forwards;
    }
    .reveal-1 { animation-delay: .1s; }
    .reveal-2 { animation-delay: .45s; }
    .reveal-3 { animation-delay: .8s; }
    .reveal-4 { animation-delay: 1.15s; }
    .reveal-5 { animation-delay: 1.5s; }
    .reveal-6 { animation-delay: 1.85s; }

    /* ================= ZONE 1 -- section header: 0.75 unit ================= */
    .top-section {
      flex: 0 0 calc(var(--unit) * 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 var(--gutter);
      overflow: hidden;
    }
    .subtitle-wrap svg {
      width: auto;
      height: 3.6vh;
      max-width: 60vw;
      display: block;
    }

    /* ================= ZONE 2 -- data vis: 6 units (the priority element) ================= */
    .datavis-section {
      flex: 0 0 calc(var(--unit) * 6);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 var(--gutter);
      overflow: hidden; /* safety net: zone content is sized to fit exactly
                            within its 6-unit budget, this just guarantees a
                            sizing slip never pushes the zones below it */
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      gap: 2vw;
      margin-bottom: 2vh;
    }
    .stat-tile { flex: 1 1 0; text-align: center; }
    .stat-label {
      font-size: var(--fs-eyebrow);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4vh;
    }
    .stat-value {
      font-size: var(--fs-stat);
      font-weight: 700;
      color: var(--white);
      line-height: 1.05;
    }
    .stat-value.accent { color: var(--teal-light); }

    .meter {
      position: relative;
      width: 100%;
      height: 4.2vh;
      margin-bottom: 2vh;
    }
    .meter-track {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(36, 178, 185, 0.14);
      border: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .meter-fill {
      position: relative;
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--teal-deep), var(--teal) 60%, var(--teal-light));
      transition: width 1.4s cubic-bezier(.4,0,.2,1);
      overflow: hidden;
      box-shadow: 0 0 0 rgba(36,178,185,0);
      animation: meterGlow 4.5s ease-in-out infinite;
    }
    .meter-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 40%, rgba(255,255,255,.45) 50%, transparent 60%);
      background-size: 260% 100%;
      animation: shimmerSweep 5.5s linear infinite;
    }
    @keyframes meterGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(36,178,185,0); }
      50%      { box-shadow: 0 0 5vh rgba(36,178,185,.55); }
    }
    @keyframes shimmerSweep {
      0%   { background-position: 220% 0; }
      100% { background-position: -220% 0; }
    }
    .meter-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1rem, 1.5vw, 1.5rem);
      font-weight: 700;
      color: var(--white);
      text-shadow: 0 1px 4px rgba(0,0,0,.5);
      z-index: 2;
    }

    .floorplan-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .floorplan-wrap svg {
      width: auto;
      max-width: 100%;
      height: 37vh;
      display: block;
    }
    /* Fill only -- no stroke on the room labels per the source type spec. */
    .room-name {
      font-family: 'Barlow', sans-serif !important;
      font-weight: 700 !important;
      font-size: 30px !important;
      fill: #3f3f3f !important;
    }
    .room-shape {
      stroke: var(--bg);
      stroke-width: 5;
      stroke-miterlimit: 10;
    }

    /* ================= ZONE 3 -- Give Now: 1.25 units, three equal columns ================= */
    .cta-section {
      flex: 0 0 calc(var(--unit) * 1.25);
      display: flex;
      align-items: flex-start;
      padding: 0 var(--gutter);
      overflow: hidden;
    }
    .cta-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      gap: 2vw;
    }
    .cta-col-label { text-align: left; }
    .cta-heading {
      font-size: var(--fs-heading);
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #24b2b9;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .cta-heading span { color: var(--teal-light); }

    .cta-col-qr {
      display: flex;
      justify-content: center;
      animation: ctaPulse 3.4s ease-in-out infinite;
    }
    @keyframes ctaPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.03); }
    }
    .qr-frame {
      width: calc(var(--unit) * 1.25 * 0.72);
      height: calc(var(--unit) * 1.25 * 0.72);
      background: var(--white);
      border-radius: 10px;
      padding: 8%;
      box-shadow: 0 0 0 rgba(36,178,185,0);
      animation: qrGlow 3.4s ease-in-out infinite;
    }
    @keyframes qrGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(36,178,185,0); }
      50%      { box-shadow: 0 0 3vh rgba(36,178,185,.6); }
    }

    .cta-col-link { text-align: right; }
    .cta-link-label {
      font-size: var(--fs-eyebrow);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.4vh;
    }
    /* PLACEHOLDER: replace with the real giving URL */
    .cta-link {
      font-size: var(--fs-body);
      font-weight: 700;
      color: var(--white);
      border-bottom: 2px solid var(--teal);
      padding-bottom: 0.2vh;
      white-space: nowrap;
      display: inline-block;
    }

    /* ================= ZONE 4 -- photo + campaign message: 4 units (the bottom third) ================= */
    .photo-section {
      flex: 0 0 calc(var(--unit) * 4);
      position: relative;
      overflow: hidden;
    }
    .photo-frame {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    /* The image is deliberately oversized (106%, at a -3% inset) and stays
       that way through the whole Ken Burns cycle. At exactly 100%/inset:0,
       sub-pixel rounding on the section's fractional height let a hairline
       of the page background flash through at the top/bottom edge during
       the animation (the reported "glitchy line") -- the scaled image
       could fall a fraction of a pixel short of the frame for a moment.
       Overselling the image by a few percent guarantees full coverage at
       every point of the animation regardless of rounding. */
    .photo-frame img {
      position: absolute;
      top: -3%; left: -3%; right: -3%; bottom: -3%;
      width: 106%;
      height: 106%;
      object-fit: cover;
      object-position: center;
      transform-origin: center center;
      animation: kenBurns 42s ease-in-out infinite;
      will-change: transform;
      backface-visibility: hidden;
    }
    @keyframes kenBurns {
      0%   { transform: scale(1) translate(0, 0); }
      50%  { transform: scale(1.07) translate(-1.2%, -0.8%); }
      100% { transform: scale(1) translate(0, 0); }
    }
    .photo-fade-top {
      position: absolute;
      top: 0; left: 0; right: 0; height: 6vh;
      background: linear-gradient(180deg, var(--bg) 0%, rgba(63,63,63,0) 100%);
      z-index: 1;
    }

    /* ---- "Make Room for ___" message, layered on the photo, per the
       reference mock-up: a small logo + "for" lockup, then one huge word
       that fills the available width, cycling one at a time. ---- */
    .photo-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 2;
    }
    .photo-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(63,63,63,.15) 0%, rgba(63,63,63,.72) 45%, rgba(63,63,63,.88) 100%);
    }
    .overlay-content {
      position: relative;
      padding: 0 var(--gutter);
      width: 100%;
    }
.overlay-logo-big {
  display: flex;
  justify-content: center;
  margin-bottom: 0vh;
}
    .overlay-logo-mini svg {
      width: auto;
      height: 18vh;
      display: block;
    }
    .overlay-for {
      font-size: var(--fs-lockup);
      font-weight: 600;
      color: var(--white);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      margin-bottom: 0vh;
      margin-left: 0.8vw;
    }
    .overlay-word-wrap {
      width: 100%;
      overflow: hidden;
    }
    .overlay-word {
      display: inline-block;
      font-size: var(--fs-hero-base);
      font-weight: 800;
      color: var(--white);
      text-transform: uppercase;
      line-height: 0.94;
      white-space: nowrap;
      transform-origin: left center;
      transition: opacity .5s ease;
    }
    .overlay-word.cycling { opacity: 0; }
  </style>
</head>

          <div class="cta-link-label">Give online</div>
          <!-- PLACEHOLDER: replace with the real giving-page URL -->
          <div class="cta-link">paradisetx.org/MakeRoom</div>
        </div>
      </div>
    </section>

  </div>

  <script>
    /*
      Data source: this page is hosted as a static file (e.g. GitHub Pages),
      so it fetches JSON from the Apps Script Content Service endpoint
      instead of using google.script.run (which only exists when a page is
      served BY Apps Script itself). Same contract as before:
      { rooms: [{roomId, percentage, color}], globalStats: {goal, current,
      remaining, progressPct, progressFormatted}, lastUpdated }.

      If the fetch fails (network hiccup, endpoint briefly down), this falls
      back to sample data so the sign stays visually intact rather than
      showing a blank page.
    */
    var DATA_URL = 'https://script.google.com/macros/s/AKfycbyOIfR4B6U2vxRrCMkQR8ZiJrqV-HfgCD89RVOOldgCrC8Okdp82jdNbbuW9nEeKa-7BA/exec?format=json';
    function renderData(data) {
      if (!data || !data.rooms || !data.globalStats) return;

      document.getElementById('val-goal').textContent = data.globalStats.goal;
      document.getElementById('val-current').textContent = data.globalStats.current;
      document.getElementById('val-remaining').textContent = data.globalStats.remaining;

      const pctVal = data.globalStats.progressPct || 0;
      const formattedPct = (data.globalStats.progressFormatted || pctVal.toFixed(1)) + '%';
      document.getElementById('meter-fill').style.width = Math.min(pctVal, 100) + '%';
      document.getElementById('meter-label').textContent = formattedPct;

      updateFloorplan(data.rooms);
    }

    function updateFloorplan(roomArray) {
      const defs = document.getElementById('dynamic-defs');
      roomArray.forEach(function (room) {
        const shape = document.getElementById(room.roomId);
        if (!shape) return;
        const gradId = 'grad-' + room.roomId;
        let grad = document.getElementById(gradId);
        if (!grad) {
          const template = document.getElementById('fill-template');
          grad = template.cloneNode(true);
          grad.id = gradId;
          defs.appendChild(grad);
        }
        const stops = grad.getElementsByTagName('stop');
        const p = (room.percentage || 0) + '%';
        stops[0].setAttribute('offset', p);
        stops[0].setAttribute('stop-color', room.color || '#24b2b9');
        stops[1].setAttribute('offset', p);
        shape.style.fill = 'url(#' + gradId + ')';
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      fetch(DATA_URL)
        .then(function (res) { return res.json(); })
        .then(renderData)
        .catch(function (err) {
          console.error('getRoomData failed', err);
          // Fallback sample data so the sign stays visually intact.
          renderData({
            globalStats: { goal: '$2,400,000', current: '$1,380,500', remaining: '$1,019,500', progressPct: 57.5, progressFormatted: '57.5' },
            rooms: [
              { roomId: 'Worship', percentage: 82, color: '#24b2b9' },
              { roomId: 'Kids', percentage: 61, color: '#24b2b9' },
              { roomId: 'Support', percentage: 45, color: '#24b2b9' },
              { roomId: 'Foyer', percentage: 70, color: '#24b2b9' },
              { roomId: 'CoveredEntry', percentage: 30, color: '#24b2b9' },
              { roomId: 'Playground', percentage: 20, color: '#24b2b9' },
              { roomId: 'PorteCochere', percentage: 15, color: '#24b2b9' }
            ],
            lastUpdated: 'preview'
          });
        });

      startWordCycle();
    });

    /*
      "Make Room for ___" word cycle, overlaid on the photo. Each word is
      auto-fit to the full available width (fitCycleWord), matching the
      reference mock-up where the word always spans the frame regardless of
      how many letters it has, rather than using one fixed font-size that
      would leave short words small and clip long ones.

      PLACEHOLDER LIST -- swap these for the real campaign words (send them
      over and I'll drop them in, or just edit this array directly in the
      Apps Script editor).
    */
    var CYCLE_WORDS = ['Worship', 'Growth', 'Hope', 'Forgiveness'];
    var cycleIdx = 0;
    var HERO_BASE_VH = 15;   // matches --fs-hero-base
    var HERO_MIN_VH = 6;
    var HERO_MAX_VH = 24;

function fitCycleWord(el, text) {
  el.textContent = text;
}

    function startWordCycle() {
      if (!CYCLE_WORDS.length) return;
      var el = document.getElementById('cycle-word');
      if (!el) return;
      fitCycleWord(el, CYCLE_WORDS[0]);
      if (CYCLE_WORDS.length < 2) return; // nothing to cycle to
      setInterval(function () {
        el.classList.add('cycling');
        setTimeout(function () {
          cycleIdx = (cycleIdx + 1) % CYCLE_WORDS.length;
          fitCycleWord(el, CYCLE_WORDS[cycleIdx]);
          el.classList.remove('cycling');
        }, 500); // matches .overlay-word transition duration
      }, 3600);
    }
  </script>
</body>
</html>
